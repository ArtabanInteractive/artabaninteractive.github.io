<b id="ttitle">TABLE</b><br><br>

<script src="render25.js?v=2"></script>
<script>
'use strict';
// ============ THE ENGINE: our 240Hz lineage, VPX-calibrated ============
// world in VPX units (952.94 x 1976.47, ball r25), slope 5.25deg classic.
const FPS = 240, SUB = 4, H = 1 / (FPS * SUB);
const GRAV = 1600;                 // tuned: full-field roll ~2.6s, classic pace
const BALL_R = 25;

let GEO = null;
const S = { balls: [], score: 0, ballsLeft: 3, drops: [], lanes: [], bankDone: {}, rampOpen: {}, spinVal: 100,
  saucerLit: false, saucerHold: 0, plungePull: 0, plunging: false, msg: 'PLUNGE TO START', msgT: 0,
  flipL: false, flipR: false, angL: 0, angR: 0, over: false };

// ============ M3 — THUNDERHEAD RULES ============
// The arc (SCARAB-RULES.md, reskinned to storm marks): three bank TRIALS light their
// marks -> with all three lit, one loop rip BREAKS THE STORM (timed cyan mode, boosted
// scoring, saucer = jackpot, re-rips extend) -> mode ends, trials reset, loop value
// ratchets and carries. Two-state lights only, one arc, no stacked modes (era law).
// Trial marks match the bay labels printed on the master drawing, so art and rules
// name the same things: bank 0 = TR = VANE, bank 1 = centre = EYE, bank 2 = LL = FUNNEL.
const TRIAL_NAMES = ['VANE', 'EYE', 'FUNNEL'];
const RULES = {
  loopBase: 1500, loopStep: 500, loopMax: 6000,   // ratchet: carries across mode ends
  stormSecs: 25, stormExtend: 8, stormMaxSecs: 45,
  jackpotBase: 25000, jackpotStep: 10000,
  stormMult: 3,                                    // all switch scoring x3 while broken
  bonusPerPop: 100, bonusPerDrop: 200, bonusMultMax: 5,
};
const LOCKS_FOR_MULTIBALL = 2;
const RULES_REPEAT_LOCK = 25000;   // same lock twice in a round: flat, no escalation
// THE SCORE TABLE (2026-09-12). Every switch value in one place, scaled so a
// three-drain game is tens of thousands, a game with a lock and a couple of
// chutes is hundreds of thousands, and a multiball with jackpots plus the
// finale is millions. award() still multiplies by the storm level. Chute,
// hole and peg values live in the geometry; jackpot escalation in R.
const SCORE = {
  sling: 250, pop: 1000, popMultiball: 3000,
  lane: 5000, lanesAll: 25000,
  drop: 5000, bankSwept: 50000,
  lock: 50000,
  bonusPop: 1000, bonusDrop: 2000, bonusLane: 1000,
};
const R = {
  locks: 0,               // balls held in the lock vortexes
  multiball: 0,           // balls in play when multiball started (0 = not running)
  mbJack: {},             // which locks have been jackpotted this multiball round
  mbJackVal: 100000,      // lock jackpot, escalates through the multiball
  superLit: false,        // both locks hit -> canopy hole pays the super
  mbLit: false,           // both locks FULL -> canopy hole starts multiball
  // STORM LEVELS. Each multiball completed raises the level; scoring scales
  // with it and from level 2 the rollover set must be completed before the
  // locks will arm. Three multiballs and the giant's face lights: the one
  // part of the table that can never hold hardware becomes the final shot.
  level: 1,               // 1..3, multiplies every award
  mbCount: 0,             // multiballs completed this game
  setDone: false,         // rollover set completed since the last multiball
  faceLit: false,         // wizard: shoot both eyes
  eyes: [0, 0],           // which eyes have been hit
  mouthOpen: false,       // both eyes hit: feed the giant to break the storm
  trials: [0, 0, 0],      // which storm marks are lit
  loopVal: RULES.loopBase,
  storm: 0,               // seconds remaining of THE STORM BREAKS (0 = idle)
  stormCount: 0,          // times broken this game
  jackpot: RULES.jackpotBase,
  bonus: 0, bonusMult: 1,
  bonusPayout: 0,         // remaining amount still being counted onto the score
};
function rulesResetGame() {
  S.rampOpen = {};
  R.level = 1; R.mbCount = 0; R.setDone = false; R.faceLit = false; R.eyes = [0, 0]; R.mouthOpen = false;
  R.locks = 0; R.multiball = 0; R.mbJack = {}; R.mbJackVal = 100000;
  R.superLit = false; R.mbLit = false;
  for (const bw of BOWLS) bw.occupied = false;
  R.trials = [0, 0, 0]; R.loopVal = RULES.loopBase; R.storm = 0; R.stormCount = 0;
  R.jackpot = RULES.jackpotBase; R.bonus = 0; R.bonusMult = 1; R.bonusPayout = 0;
}
// NOT reset here: S.rampOpen. Sweeping the bank opens the canopy for the whole
// game, not just the ball, so only rulesResetGame clears it.
function rulesResetBall() {
  R.bonus = 0; R.bonusPayout = 0;
  // SUPER is a multiball award. It does not survive the ball it was lit on.
  R.superLit = false;
}
const trialsLit = () => R.trials.reduce((a, b) => a + b, 0);
// every switch score routes through here so THE STORM multiplier is impossible to forget
function award(pts) {
  const scored = Math.round(pts * (R.storm > 0 ? RULES.stormMult : 1) * (R.level || 1));
  S.score += scored;
  return scored;            // so a flash can show what was ACTUALLY scored
}
function breakTheStorm() {
  R.storm = RULES.stormSecs;
  R.stormCount++;
  S.saucerLit = true;                       // saucer collects the jackpot while broken
  snd.storm();
  flash('THE STORM BREAKS!');
  hap(120);
}
function endStorm() {
  R.storm = 0;
  R.trials = [0, 0, 0];                     // trials reset...
  R.loopVal = Math.min(RULES.loopMax, R.loopVal + RULES.loopStep);   // ...loop value carries
  R.jackpot = RULES.jackpotBase + R.stormCount * RULES.jackpotStep;
  S.saucerLit = false;
  // (was: refill every bank here. The drop bank is now a permanent unlock, so
  // nothing outside a new game may stand its targets back up.)
  flash('STORM PASSES — LOOP ' + R.loopVal);
}

// ---- audio: synthesized, license-free ----
const AC = new (window.AudioContext || window.webkitAudioContext)();
const masterBus = AC.createGain(); masterBus.gain.value = 1.0; masterBus.connect(AC.destination);
const sfxBus = AC.createGain();    sfxBus.gain.value = 1.0;    sfxBus.connect(masterBus);
const musicBus = AC.createGain();  musicBus.gain.value = 0.55; musicBus.connect(masterBus);
// ============ MUSIC (ported from the art build, 2026-09-11) ============
// Four Suno tracks (Ian's own, Premier plan = commercial rights cleared). The
// files live in music/ which is git-ignored (9 MB); the game runs without them.
// loopEnd values are EXPLICIT constants and must never be replaced by
// buffer.duration: the Vorbis decoder hands back ~15-20ms of frame padding past
// the true end, which would splice a sliver of junk into every wrap. Each value
// is the last whole bar before that track's fade-out. Seams confirmed by ear
// (Ian, 2026-08-26).
const MUSIC = {
  tracks: {
    intro:     { url: 'music/intro.ogg',     loopEnd: 49.20  },
    gameplay1: { url: 'music/gameplay1.ogg', loopEnd: 144.15 },
    gameplay2: { url: 'music/gameplay2.ogg', loopEnd: 129.87 },
    gameplay3: { url: 'music/gameplay3.ogg', loopEnd: 163.01 },
  },
  bufs: {}, src: null, gain: null, cur: null,
  bag: [],            // shuffle bag so the same track never repeats back-to-back
  on: true, loaded: false,
};
try { MUSIC.on = localStorage.getItem('th_music') !== '0'; } catch (e) {}
async function musicLoad() {
  for (const [k, t] of Object.entries(MUSIC.tracks)) {
    try {
      const r = await fetch(t.url);
      if (!r.ok) continue;
      MUSIC.bufs[k] = await AC.decodeAudioData(await r.arrayBuffer());
    } catch (e) { /* music is optional --- never let it break the game */ }
  }
  MUSIC.loaded = true;
}
function musicPlay(key, fade = 1.2) {
  if (!MUSIC.on || !MUSIC.bufs[key] || AC.state !== 'running') return;
  if (MUSIC.cur === key && MUSIC.src) return;
  musicStop(fade);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(1, AC.currentTime + fade);
  g.connect(musicBus);
  const s = AC.createBufferSource();
  s.buffer = MUSIC.bufs[key];
  s.loop = true; s.loopStart = 0; s.loopEnd = MUSIC.tracks[key].loopEnd;
  s.connect(g); s.start();
  MUSIC.src = s; MUSIC.gain = g; MUSIC.cur = key;
}
function musicStop(fade = 0.8) {
  const s = MUSIC.src, g = MUSIC.gain;
  MUSIC.src = null; MUSIC.gain = null; MUSIC.cur = null;
  if (!s) return;
  const t = AC.currentTime;
  try {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + fade);
    s.stop(t + fade + 0.05);
  } catch (e) { try { s.stop(); } catch (e2) {} }
}
function musicNextGameplay() {
  if (!MUSIC.bag.length) {
    MUSIC.bag = ['gameplay1', 'gameplay2', 'gameplay3']
      .filter(k => MUSIC.bufs[k])
      .sort(() => Math.random() - 0.5);
    // never repeat the track that just finished across a bag boundary
    if (MUSIC.bag.length > 1 && MUSIC.bag[0] === MUSIC.cur) MUSIC.bag.push(MUSIC.bag.shift());
  }
  const next = MUSIC.bag.shift();
  if (next) musicPlay(next);
}
// Called every frame: starts the right track once audio is unlocked, and handles
// the attract <-> play transition. A track runs for a WHOLE GAME, not a ball
// (Ian, 2026-08-26: "do not start new songs with each death. Just keep the song
// going"). The rotation happens once per game, on the way back out of attract.
function musicEnsure() {
  if (!MUSIC.on || !MUSIC.loaded || AC.state !== 'running') return;
  const attract = S.over;
  sfxAmbience(!attract);
  if (attract) { musicPlay('intro'); return; }
  if (!MUSIC.cur || MUSIC.cur === 'intro') musicNextGameplay();
}
function musicSetOn(v) {
  MUSIC.on = v;
  try { localStorage.setItem('th_music', v ? '1' : '0'); } catch (e) {}
  if (!v) { musicStop(0.35); sfxAmbience(false); } else musicEnsure();
}

// ---- SFX ENGINE, rebuilt (Sonnet, overnight, 2026-08-28) ----
// The previous set was bare oscillator blips: one wave, one exponential decay,
// nothing else. Real pinball hits are METAL + AIR + a struck body, so every event
// below is a layered stack — an oscillator "body" (the struck material's pitch)
// plus a filtered noise "transient" (the strike itself) plus, for anything with
// mass, a pitch envelope. blip() is kept for the few pure-tone cases (bonusTick).
function blip(freq, dur, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.value = vol || 0.06;
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  o.connect(g); g.connect(sfxBus);
  o.start(); o.stop(AC.currentTime + dur);
}
// A short burst of filtered noise — the "transient" every physical hit has that a
// pure oscillator can't produce. One shared white-noise buffer, reused and sliced,
// since generating fresh noise per call is wasted work at 240Hz physics.
const NOISE_BUF = (() => {
  const b = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
})();
function noiseHit(dur, vol, freq, q, type) {
  const src = AC.createBufferSource(); src.buffer = NOISE_BUF;
  src.loopStart = Math.random() * 1.5; src.loop = false;
  const f = AC.createBiquadFilter(); f.type = type || 'bandpass';
  f.frequency.value = freq || 1200; f.Q.value = q ?? 1.2;
  const g = AC.createGain(); g.gain.value = vol;
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  src.connect(f); f.connect(g); g.connect(sfxBus);
  src.start(); src.stop(AC.currentTime + dur);
}
// An oscillator "body" with independent pitch AND amplitude envelopes, so a hit
// can pitch-drop as it decays (a struck solenoid, a falling target) instead of
// just going quiet at a fixed pitch.
function tone(freq, dur, type, vol, opts) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, AC.currentTime);
  if (opts && opts.pitchTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, opts.pitchTo), AC.currentTime + dur);
  g.gain.setValueAtTime(0.0001, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(vol, AC.currentTime + (opts?.attack || 0.002));
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  o.connect(g); g.connect(sfxBus);
  o.start(); o.stop(AC.currentTime + dur);
}
const hap = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const snd = {
  // rubber striking a moving bat — noise crack + a short mid body, not just a beep
  flip: () => { noiseHit(0.03, 0.05, 2400, 0.9); tone(210, 0.04, 'triangle', 0.05, { pitchTo: 140 }); },
  // pop bumper: hard transient thock + the ring's own resonant pitch decaying
  pop: () => { noiseHit(0.05, 0.11, 900, 1.4); tone(300, 0.09, 'square', 0.08, { pitchTo: 180 }); tone(620, 0.05, 'triangle', 0.04); hap(12); },
  sling: () => { noiseHit(0.04, 0.09, 1500, 1.1); tone(260, 0.07, 'sawtooth', 0.06, { pitchTo: 160 }); hap(12); },
  spin: () => noiseHit(0.03, 0.05, 2800, 2.2),
  // drop target: falling metal plate — noise clack then a low wooden thud with a
  // real pitch drop, plus a mechanical click as the mech catches it
  drop: () => { noiseHit(0.02, 0.1, 3200, 1.6); tone(160, 0.16, 'sawtooth', 0.09, { pitchTo: 55 }); setTimeout(() => noiseHit(0.015, 0.05, 4500, 3), 70); hap(18); },
  bank: () => { [440, 550, 660, 880].forEach((f, i) => setTimeout(() => { tone(f, 0.12, 'triangle', 0.08); noiseHit(0.02, 0.03, f * 3, 2); }, i * 90)); hap(40); },
  lane: () => tone(520, 0.08, 'sine', 0.06),
  laneAll: () => { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.1, 'triangle', 0.07), i * 80)); },
  // saucer: ball rattling into a metal cup — noise roll into a resonant sine well
  saucer: () => { noiseHit(0.22, 0.06, 700, 0.8, 'lowpass'); tone(200, 0.3, 'sine', 0.07, { pitchTo: 140 }); },
  award: () => { [392, 523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'triangle', 0.09), i * 70)); },
  drain: () => { noiseHit(0.4, 0.05, 300, 0.6, 'lowpass'); tone(220, 0.3, 'sawtooth', 0.06, { pitchTo: 90 }); setTimeout(() => tone(110, 0.5, 'sawtooth', 0.07, { pitchTo: 40 }), 150); hap(60); },
  wall: (v) => { if (v > 300) noiseHit(0.03, Math.min(0.05, v / 20000), 1400 + Math.min(v, 1200), 1.2); },
  // MODE ENTRY (existing) — kept, now layered with a real sub rumble under it
  storm: () => {
    noiseHit(0.5, 0.08, 200, 0.5, 'lowpass');
    [60, 50, 42, 90].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'sawtooth', 0.1), i * 60));
    [330, 415, 494, 660].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'triangle', 0.08), 220 + i * 90));
    hap(180);
  },
  // MODE EXIT — new. endStorm() previously fired silently; a mode that announces
  // itself starting and then just stops reads as a bug, not a passing storm.
  stormEnd: () => {
    noiseHit(0.5, 0.07, 260, 0.6, 'lowpass');
    tone(180, 0.45, 'sawtooth', 0.08, { pitchTo: 55 });
    setTimeout(() => tone(140, 0.35, 'sine', 0.05, { pitchTo: 60 }), 120);
    hap(60);
  },
  thunder: () => { noiseHit(0.3, 0.07, 220, 0.5, 'lowpass'); tone(70, 0.14, 'sawtooth', 0.09); setTimeout(() => tone(55, 0.2, 'sawtooth', 0.08), 60); hap(70); },
  bonusTick: () => blip(700, 0.02, 'square', 0.03),
  // GATE VOICES — new. Both GATE (the diverter) and LGATE (the launch-lane seal)
  // previously rose and retracted in total silence. Each gets a solenoid-driven
  // metal-plate voice: a mechanical clack from the catch, and a short pitched
  // clunk from the plate itself, rising in pitch as it comes UP (steel meeting
  // its stop) and falling as it drops back flush (settling into the slot).
  gateUp:    () => { noiseHit(0.03, 0.07, 2000, 1.0); tone(150, 0.09, 'square', 0.06, { pitchTo: 260 }); },
  gateDown:  () => { noiseHit(0.025, 0.06, 1600, 1.1); tone(220, 0.08, 'square', 0.05, { pitchTo: 110 }); },
};
snd.bonus = snd.bonus || snd.bonusTick;

// ============ THE STORM VOICES (2026-09-11) ============
// Three synthesized storms were rejected by ear; these are Ian's own Suno
// takes, cut and normalised by sfx-build.mjs into sfx-out/*.ogg. Every one is
// a thing in the machine doing something (the Alibi rule). Where a sample is
// missing the old synth voice plays instead, so the game never goes silent.
const SFX = {
  names: ['vortex-enter', 'chute-small', 'chute-eye', 'lock', 'multiball', 'jackpot', 'super-jackpot',
          'storm-level', 'eye', 'storm-breaks', 'bank-swept', 'canopy-hole', 'tilt', 'ambience',
          // THE MACHINE (CC0 recordings of real EMs, 2026-09-12): a sample layer
          // over the synth voices below; each synth stays as the fallback.
          'flip-1', 'flip-2', 'flip-3', 'flip-release', 'pop-1', 'pop-2', 'pop-3', 'pop-4', 'sling',
          'drop-1', 'drop-2', 'bank', 'lane', 'lane-all', 'award', 'bonus-tick', 'knock', 'spin',
          'saucer', 'plunge-1', 'plunge-2', 'gate', 'credit', 'peg-1', 'peg-2', 'peg-3', 'peg-4'],
  bufs: {}, amb: null,
};
async function sfxLoad() {
  for (const n of SFX.names) {
    try { const r = await fetch('sfx-out/' + n + '.ogg'); if (r.ok) SFX.bufs[n] = await AC.decodeAudioData(await r.arrayBuffer()); }
    catch (e) { /* optional --- the synth fallback covers it */ }
  }
}
function sample(name, vol = 1, rate = 1) {
  const b = SFX.bufs[name];
  if (!b || AC.state !== 'running') return false;
  const s = AC.createBufferSource(); s.buffer = b; s.playbackRate.value = rate;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(g); g.connect(sfxBus); s.start();
  return true;
}
// wind and distant rain under the music while a game is on; through the music
// bus so the M key silences it with the music
function sfxAmbience(on) {
  if (on && !SFX.amb && SFX.bufs.ambience && AC.state === 'running') {
    const s = AC.createBufferSource(); s.buffer = SFX.bufs.ambience; s.loop = true;
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22, AC.currentTime + 2);
    s.connect(g); g.connect(musicBus); s.start(); SFX.amb = { s, g };
  } else if (!on && SFX.amb) {
    const { s, g } = SFX.amb; SFX.amb = null;
    try { g.gain.cancelScheduledValues(AC.currentTime); g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 1); s.stop(AC.currentTime + 1.1); } catch (e) {}
  }
}
// The machine voices: which samples each snd.* event draws from (a random
// variant so a hundred flips a ball do not sound like one flip a hundred
// times), and how loud. Anything not listed (walls, storm synths) is untouched.
const MECH = {
  flip: ['flip-1', 'flip-2', 'flip-3'], flipRelease: ['flip-release'],
  pop: ['pop-1', 'pop-2', 'pop-3', 'pop-4'], sling: ['sling'], drop: ['drop-1', 'drop-2'], bank: ['bank'],
  lane: ['lane'], laneAll: ['lane-all'], award: ['award'], bonusTick: ['bonus-tick'], knock: ['knock'],
  spin: ['spin'], saucer: ['saucer'], plunge: ['plunge-1', 'plunge-2'], gateUp: ['gate'], gateDown: ['gate'], credit: ['credit'],
  peg: ['peg-1', 'peg-2', 'peg-3', 'peg-4'],
};
const MECH_GAIN = { flip: 0.7, flipRelease: 0.45, pop: 0.8, sling: 0.7, drop: 0.8, bonusTick: 0.5, spin: 0.6, gateUp: 0.5, gateDown: 0.5 };
snd.peg = (v) => { if (v > 60) noiseHit(0.02, Math.min(0.06, v / 12000), 3200, 2.0); };   // synth fallback
function mechInstall() {
  for (const [k, names] of Object.entries(MECH)) {
    const synth = snd[k];
    snd[k] = (...a) => {
      const n = names[(Math.random() * names.length) | 0];
      const vol = k === 'peg' ? Math.min(1, 0.25 + (a[0] || 0) / 900) : (MECH_GAIN[k] ?? 1);
      if (!sample(n, vol)) { if (synth) synth(...a); }
    };
  }
}
mechInstall();
snd.laneAll = snd.laneAll || snd.lane;


// ---- geometry prep ----
let SEGS = [], SLINGSEGS = [], DROPSEGS = [], POSTS = [];
function buildColliders() {
  SEGS = []; SLINGSEGS = []; DROPSEGS = [];
  for (const w of GEO.walls) {
    const p = w.pts;
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length];
      if (Math.hypot(a[0] - b[0], a[1] - b[1]) < 0.5) continue;
      SEGS.push({ x1: a[0], y1: a[1], x2: b[0], y2: b[1], e: 0.3 });
    }
  }
  // A slingshot kicks from ONE face: the long rubber that faces the middle of
  // the table. Every edge of the polygon used to kick (Ian, 2026-09-12: "when
  // you hit the outsides of them, it causes a sling effect?" --- it did), so a
  // ball brushing the back of a sling from the outlane got fired. Now the
  // back and the short ends are plain rubber walls.
  GEO.slings.forEach((w, si) => {
    const p = w.pts;
    const cx0 = p.reduce((t, q) => t + q[0], 0) / p.length, cy0 = p.reduce((t, q) => t + q[1], 0) / p.length;
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length];
      const L = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (L < 0.5) continue;
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;

// The ball rests ON THE PLUNGER TIP, not on the cabinet floor --- which is how
// a real machine works. The tip is a live collider: drawing the plunger back
// visibly drags the ball down the lane with it, and the Feed ramp mouth sits
// just above the rest position to take the ball the moment it launches.
// Travel is bounded by the spring's solid height (see render25.js HOUSING).

  const target = PLUNGER.restY + Math.min(1, S.plungePull) * PLUNGER.travel;

    const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 160 + i);
    cx.beginPath(); cx.arc(ey.x, ey.y, 40, 0, 7);
    cx.strokeStyle = on ? '#fff1a8' : 'rgba(255,170,60,' + pulse + ')'; cx.lineWidth = on ? 7 : 5; cx.stroke();
    cx.fillStyle = on ? 'rgba(255,220,120,0.35)' : 'rgba(255,140,40,' + (0.12 * pulse) + ')'; cx.fill();
  }
  if (R.mouthOpen && GEO.mouth) {
    const mo = GEO.mouth, pulse = 0.55 + 0.45 * Math.sin(performance.now() / 120);
    cx.beginPath(); cx.arc(mo.x, mo.y, mo.r, 0, 7);
    cx.strokeStyle = 'rgba(248,100,4,' + pulse + ')'; cx.lineWidth = 6; cx.stroke();
    cx.fillStyle = 'rgba(248,100,4,' + (0.15 * pulse) + ')'; cx.fill();
  }
  for (let i = 0; i < GEO.lanes.length; i++) {
    const l = GEO.lanes[i];
    cx.beginPath(); cx.arc(l.x, l.y, 22, 0, 7);
    cx.strokeStyle = S.lanes[i] ? '#7fe8a0' : '#3f5a50'; cx.lineWidth = 5; cx.stroke();
    if (S.lanes[i]) { cx.fillStyle = 'rgba(127,232,160,0.25)'; cx.fill(); }
  }
  if (GEO.saucer) {
    cx.beginPath(); cx.arc(GEO.saucer.x, GEO.saucer.y, GEO.saucer.r, 0, 7);
    cx.strokeStyle = S.saucerLit ? '#ffe27a' : '#5a6a58'; cx.lineWidth = 5;
    if (S.saucerLit) { cx.fillStyle = 'rgba(255,226,122,0.2)'; cx.fill(); }
    cx.stroke();
  }
  for (const f of GEO.flippers) {
    const ang = f.side === 'L' ? S.angL : S.angR;
    const a = (f.start + (f.endA - f.start) * ang) * Math.PI / 180;
    cx.strokeStyle = '#f0e0c0'; cx.lineWidth = f.base * 2;
    cx.beginPath(); cx.moveTo(f.x, f.y);
    cx.lineTo(f.x + f.len * Math.sin(a), f.y - f.len * Math.cos(a)); cx.stroke();
  }
  // the plunger tip the ball rests on (greybox view: a bar; the 2.5D view draws the mechanism)
  cx.strokeStyle = '#c8d0d8'; cx.lineWidth = 6;
  cx.beginPath(); cx.moveTo(LANE.x0 + 3, PLUNGER.tipY); cx.lineTo(LANE.x1 - 3, PLUNGER.tipY); cx.stroke();
  // plunger pull indicator
  if (S.plungePull > 0) {
    cx.fillStyle = '#ffb054';
    cx.fillRect(GEO.W - 26, GEO.H - 300, 14, 280 * S.plungePull);
  }
  // raised decks: footprint tinted by height, own walls drawn brighter so the
  // upper level reads as a separate surface rather than more playfield
  for (const d of DECKS) {
    const k = Math.min(1, d.z / 100);
    cx.save();
    cx.beginPath();
    d.pts.forEach((p, i) => i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1]));
    cx.closePath();
    cx.fillStyle = `rgba(${(90+90*k)|0},${(120+80*k)|0},${(170+60*k)|0},0.26)`;
    cx.fill();
    cx.strokeStyle = 'rgba(190,215,245,0.55)'; cx.lineWidth = 3; cx.setLineDash([9, 6]);
    cx.stroke(); cx.setLineDash([]);
    cx.strokeStyle = '#cfe4ff'; cx.lineWidth = 7;
    for (const s of d.segs) { cx.beginPath(); cx.moveTo(s.x1, s.y1); cx.lineTo(s.x2, s.y2); cx.stroke(); }
    for (const h of d.holes) {
      cx.fillStyle = 'rgba(10,14,24,0.9)';
      cx.beginPath(); cx.arc(h.x, h.y, h.r, 0, 7); cx.fill();
      cx.strokeStyle = '#ffd479'; cx.lineWidth = 4;
      cx.beginPath(); cx.arc(h.x, h.y, h.r, 0, 7); cx.stroke();
    }
    for (const p of d.pins) {
      if (p.hot) p.hot--;
      const g2 = cx.createRadialGradient(p.x - 3, p.y - 3, 1, p.x, p.y, p.r);
      g2.addColorStop(0, p.hot ? '#fff6d0' : '#e8eefb');
      g2.addColorStop(1, p.hot ? '#ffb347' : '#7d8798');
      cx.fillStyle = g2; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill();
    }
    cx.fillStyle = '#9fd8ff'; cx.font = 'bold 20px ui-monospace,monospace'; cx.textAlign = 'center';
    const cxm = d.pts.reduce((a, p) => a + p[0], 0) / d.pts.length;
    const cym = d.pts.reduce((a, p) => a + p[1], 0) / d.pts.length;
    cx.fillText(d.name + '  z' + Math.round(d.z), cxm, cym);
    cx.textAlign = 'left';
    cx.restore();
  }
  drawBowls();
  drawRamps();
  for (const b of S.balls) {
    // height reads as a dropped shadow plus a slightly larger, lifted ball
    const z = b.z || 0;
    if (z > 0.5) {
      cx.fillStyle = 'rgba(0,0,0,0.4)';
      cx.beginPath(); cx.arc(b.x, b.y, BALL_R * 0.85, 0, 7); cx.fill();
    }
    const rr = BALL_R * (1 + z / 300), by = b.y - z * 0.2;
    const g = cx.createRadialGradient(b.x - 8, by - 8, 2, b.x, by, rr);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#c9ced8'); g.addColorStop(1, '#5a616d');
    cx.fillStyle = g; cx.beginPath(); cx.arc(b.x, by, rr, 0, 7); cx.fill();
  }
  // THE STORM BREAKS: the machine turns cyan (the reserved light) — unmistakable
  // full-field wash + a shrinking timer bar that GROWS BACK when a loop rip extends it
  if (R.storm > 0) {
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    cx.fillStyle = `rgba(120,220,255,${0.05 + 0.03 * Math.sin(performance.now() / 140)})`;
    cx.fillRect(0, 0, GEO.W, GEO.H);
    cx.restore();
    const bw = GEO.W - 60, frac = Math.max(0, Math.min(1, R.storm / RULES.stormMaxSecs));
    cx.fillStyle = 'rgba(120,220,255,0.25)'; cx.fillRect(30, 108, bw, 8);
    cx.fillStyle = '#7fe8ff'; cx.fillRect(30, 108, bw * frac, 8);
  }
  // HUD
  cx.fillStyle = R.storm > 0 ? '#7fe8ff' : '#e0b95a'; cx.font = 'bold 52px ui-monospace,monospace'; cx.textAlign = 'left';
  cx.fillText(S.score.toLocaleString(), 30, 64);
  cx.font = '28px ui-monospace,monospace'; cx.fillStyle = '#8fa8c8';
  cx.fillText('BALLS ' + Math.max(0, S.ballsLeft), 30, 100);
  // trial marks: which storm marks are lit (the readout for the whole arc)
  cx.font = '22px ui-monospace,monospace';
  TRIAL_NAMES.forEach((name, i) => {
    const lit = !!R.trials[i];
    cx.fillStyle = lit ? '#ffb054' : '#4a5568';
    cx.beginPath(); cx.arc(GEO.W - 150 + i * 50, 40, 12, 0, 7); cx.fill();
    cx.strokeStyle = lit ? '#ffe0a0' : '#6b7a86'; cx.lineWidth = 2; cx.stroke();
  });
  cx.fillStyle = '#8fa8c8'; cx.textAlign = 'right';
  cx.fillText('LOOP ' + R.loopVal.toLocaleString(), GEO.W - 30, 100);
  if (R.storm > 0) {
    cx.fillStyle = '#7fe8ff'; cx.font = 'bold 24px ui-monospace,monospace';
    cx.fillText('JACKPOT ' + R.jackpot.toLocaleString(), GEO.W - 30, 130);
  } else if (R.bonus > 0) {
    cx.fillStyle = '#8fa8c8'; cx.font = '22px ui-monospace,monospace';
    cx.fillText('BONUS ' + R.bonus.toLocaleString() + (R.bonusMult > 1 ? ' ' + R.bonusMult + 'X' : ''), GEO.W - 30, 130);
  }
  cx.textAlign = 'left';
  if (S.msgT > 0 || S.over) {
    cx.save();
    // fade the last 120 frames (0.5s) so it reads as settling, not blinking off
    cx.globalAlpha = S.over ? 1 : Math.min(1, S.msgT / 120);
    cx.textAlign = 'center'; cx.font = 'bold 40px ui-monospace,monospace';
    // a dark plate behind it — 40px yellow over busy cloud art was hard to read
    const tw = cx.measureText(S.msg).width;
    cx.fillStyle = 'rgba(8,12,22,0.72)';
    cx.fillRect(GEO.W / 2 - tw / 2 - 22, GEO.H * 0.56 - 40, tw + 44, 56);
    cx.fillStyle = R.storm > 0 ? '#eafcff' : '#ffe27a';
    cx.fillText(S.msg, GEO.W / 2, GEO.H * 0.56);
    cx.restore();
  }
  cx.textAlign = 'left';
}

// ---- boot ----
const TID = new URLSearchParams(location.search).get('t') || 'S';   // web build: Thunderhead by default
fetch('geometry-' + TID + '.json').then(r => r.json()).then(g => {
  GEO = g;
  GEO.oneway = GEO.oneway || []; GEO.spinners = GEO.spinners || []; GEO.eyes = GEO.eyes || [];
  S.drops = GEO.drops.map(() => 1);
  S.lanes = GEO.lanes.map(() => 0);
  document.getElementById('ttitle').textContent = GEO.title || ('TABLE ' + TID);
  document.getElementById('thelp').innerHTML = (GEO.help || []).join('<br>');
  document.title = GEO.title || 'greybox';
  buildColliders();
  buildRamps();   // no-op unless the geometry defines GEO.ramps
  buildBowls();   // no-op unless the geometry defines GEO.bowls
  buildDecks();   // no-op unless the geometry defines GEO.decks
  if (VIEW25) r25init();
  sizeCanvas();
  addEventListener('resize', sizeCanvas);
  if (window.visualViewport) visualViewport.addEventListener('resize', sizeCanvas);
  serve();
  if ('ontouchstart' in window) { S.msg = 'HOLD RIGHT EDGE — RELEASE TO PLUNGE'; S.msgT = 900; }
  requestAnimationFrame(frame);
  musicLoad(); // async, never blocks boot --- the game runs fine if it fails
  sfxLoad();
});
// self-test hook
window.__place = (x, y, vx, vy) => { S.balls = [{ x, y, vx: vx || 0, vy: vy || 0, held: 0, z: 0, vz: 0, ramp: null, deck: null }]; };
window.__ballDeck = () => S.balls.map(b => ({ x: Math.round(b.x), y: Math.round(b.y), z: Math.round(b.z||0),
  deck: b.deck !== null && b.deck !== undefined ? DECKS[b.deck].name : null, onRamp: !!b.ramp }));
window.__ballZ = () => S.balls.map(b => ({ x: +b.x.toFixed(1), y: +b.y.toFixed(1), z: +(b.z || 0).toFixed(1),
  vz: +(b.vz || 0).toFixed(1), onRamp: !!b.ramp, s: b.ramp ? +b.ramp.s.toFixed(1) : null }));
window.__setRamps = (arr) => { GEO.ramps = arr || []; buildRamps(); return RAMPS.length; };
window.__state = () => ({ balls: S.balls.map(b => [Math.round(b.x), Math.round(b.y), Math.round(b.vx), Math.round(b.vy)]), score: S.score, left: S.ballsLeft, pull: +S.plungePull.toFixed(2), plunging: S.plunging, angL: +S.angL.toFixed(2), angR: +S.angR.toFixed(2), tilt: S.tilt, warn: S.nudgeWarn,
  trials: R.trials.slice(), storm: +R.storm.toFixed(2), stormCount: R.stormCount, loopVal: R.loopVal, jackpot: R.jackpot, bonus: R.bonus, bonusMult: R.bonusMult, bonusPayout: R.bonusPayout, drops: S.drops.slice(), over: S.over, msg: S.msg });
// test-only lever: force a bank complete without physically driving the ball through
// every target, so the rules ARC can be soak-tested independently of ball physics
window.__forceBank = (bank) => {
  for (let j = 0; j < GEO.drops.length; j++) if (!GEO.drops[j].lone && (GEO.drops[j].bank || 0) === bank) S.drops[j] = 0;
  const members = []; for (let j = 0; j < GEO.drops.length; j++) if (!GEO.drops[j].lone && (GEO.drops[j].bank || 0) === bank) members.push(j);
  if (!R.trials[bank]) { R.trials[bank] = 1; const n = trialsLit(); flash(TRIAL_NAMES[bank] + ' LIT — ' + n + ' OF 3'); }
  setTimeout(() => { for (const j of members) S.drops[j] = 1; }, 50);
};
window.__shot = async () => {
  await fetch('/shot', { method: 'POST', body: cv.toDataURL('image/png') }).catch(() => {});
  return [cv.width, cv.height];
};
</script></body></html>
